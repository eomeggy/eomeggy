<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IS SEONGHYEON A CAT? - Universal Version</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #c96b92;
        }
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Khung chứa giao diện game được load tự động tùy theo thiết bị -->
    <iframe id="app-frame" src="" allow="autoplay"></iframe>

    <script>
        function loadAppropriateVersion() {
            const frame = document.getElementById('app-frame');
            
            // Kiểm tra xem thiết bị truy cập có phải là Mobile / Tablet hay không
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;

            if (isMobile) {
                // Nếu là điện thoại, load code bản Phone đã chuẩn hóa
                frame.src = 'phone.html'; 
            } else {
                // Nếu là máy tính (PC), load code bản PC
                frame.src = 'pc.html';
            }
        }

        // Chạy ngay khi tải trang
        window.onload = loadAppropriateVersion;
    </script>
</body>
</html>
