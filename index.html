<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IS SEONGHYEON A CAT?</title>
    <!-- Google Fonts: Titan One & Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Titan+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-pink: #f8d7da;
            --main-pink: #d87a93;
            --dark-burgundy: #592233;
            --card-pink: #ffc0cb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        body {
            background-color: var(--bg-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Mobile Container Frame */
        #game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--main-pink);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        @media (min-width: 423px) {
            #game-container {
                border-radius: 30px;
                border: 8px solid #c25e79;
            }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-pink);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
            display: none;
            z-index: 1;
        }

        .screen.active {
            display: flex;
            z-index: 10;
        }

        .title-exact-match {
            font-family: 'Titan One', cursive;
            color: #72334f;
            text-shadow: 
                0 0 6px #fce0e8,
                0 0 12px rgba(252, 224, 232, 0.7),
                2px 2px 4px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        /* 1. INTRO SCREEN */
        #intro-screen {
            justify-content: center;
            gap: 15px;
        }

        .video-box {
            width: 100%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            border: 4px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-box video {
            width: 100%;
            height: auto;
            max-height: 40vh;
            object-fit: contain;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .custom-btn {
            font-family: 'Titan One', cursive;
            background-color: #fff;
            color: var(--dark-burgundy);
            border: none;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .custom-btn:active {
            transform: scale(0.96);
        }

        .custom-btn.primary {
            background-color: var(--dark-burgundy);
            color: #fff;
        }

        /* 2. SELECT STAGE SCREEN */
        #stage-select-screen {
            padding: 15px 15px 15px 0.4cm;
            position: relative;
            align-items: flex-start;
        }

        .vertical-title {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-family: 'Titan One', cursive;
            font-size: 1.82rem;
            letter-spacing: 2px;
            z-index: 100;
            pointer-events: none;
            white-space: nowrap;
        }

        .stages-scroll-area {
            width: calc(100% - 2rem);
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-top: 20px;
            padding-bottom: 100px;
            align-items: flex-start;
        }

        .stage-card-item {
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        .stage-media-wrapper {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #000;
            cursor: pointer;
        }

        .stage-media-wrapper img, .stage-media-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .stage-card-item h3 {
            font-family: 'Titan One', cursive;
            color: var(--dark-burgundy);
            margin-top: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        /* 3. GAMEPLAY SCREEN */
        #gameplay-screen {
            padding: 12px;
        }

        .game-top-bar {
            width: 100%;
            background: #fff;
            border-radius: 14px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .top-btn {
            background: var(--dark-burgundy);
            color: #fff;
            border: none;
            padding: 6px 8px;
            border-radius: 8px;
            font-family: 'Titan One', cursive;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .stage-info-title {
            font-family: 'Titan One', cursive;
            font-size: 0.75rem;
            color: var(--dark-burgundy);
        }

        .game-stats {
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--dark-burgundy);
        }

        .preview-banner {
            background: #fff;
            padding: 5px 14px;
            border-radius: 12px;
            font-family: 'Titan One', cursive;
            color: var(--dark-burgundy);
            margin-bottom: 10px;
            font-size: 0.8rem;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .cards-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 360px;
            justify-content: center;
            align-content: center;
            flex-grow: 1;
            padding-bottom: 15px;
        }

        .grid-stage-1 { grid-template-columns: repeat(2, 1fr); }
        .grid-stage-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-stage-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-stage-bonus { grid-template-columns: repeat(4, 1fr); }

        .card {
            aspect-ratio: 1/1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .card.flipped .card-inner, .card-inner.rotate-y-180 {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .card-front {
            background-color: #ffc0cb;
            transform: rotateY(180deg);
        }

        .card-front img, .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 4. VICTORY SCREEN */
        #victory-modal {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 12px;
            padding: 20px;
        }

        #victory-modal h2 {
            font-family: 'Titan One', cursive;
            font-size: 1.3rem;
            color: var(--dark-burgundy);
        }

        .victory-img-box {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .victory-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .victory-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .btn-yes {
            background-color: #2ecc71 !important;
            color: white !important;
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            font-family: 'Titan One', cursive;
            border: none;
            cursor: pointer;
        }

        .btn-no {
            background-color: #e74c3c !important;
            color: white !important;
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            font-family: 'Titan One', cursive;
            border: none;
            cursor: pointer;
        }

        /* 5. RESULT MEDIA & COMMENT SCREEN (YES/NO) */
        #media-display-modal {
            justify-content: flex-start;
            padding: 15px;
            overflow-y: auto;
        }

        .comment-section-box {
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .comment-input, .name-input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 2px solid #f0d0d5;
            outline: none;
            font-size: 0.8rem;
            color: #333;
        }

        .comment-row-action {
            display: flex;
            gap: 8px;
        }

        .send-btn {
            background-color: var(--dark-burgundy);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-family: 'Titan One', cursive;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
        }

        .comment-item {
            background: #fff9fa;
            border: 1px solid #f5e1e5;
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--dark-burgundy);
        }

        .voted-badge {
            background-color: #2ecc71;
            color: white;
            font-size: 0.55rem;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: 'Titan One', cursive;
        }

        .voted-badge.no {
            background-color: #e74c3c;
        }

        .comment-body {
            font-size: 0.8rem;
            color: #444;
        }

        .comment-footer-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: #666;
        }

        .action-like, .action-reply {
            cursor: pointer;
        }

        .action-like.liked {
            color: #e74c3c;
        }

        .comment-menu-btn {
            position: absolute;
            right: 6px;
            top: 6px;
            background: none;
            border: none;
            font-weight: bold;
            cursor: pointer;
            color: #666;
            font-size: 0.85rem;
        }

        .comment-dropdown {
            position: absolute;
            right: 6px;
            top: 24px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
            flex-direction: column;
            z-index: 5;
        }

        .comment-dropdown button {
            background: none;
            border: none;
            padding: 4px 10px;
            text-align: left;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .comment-dropdown button:hover {
            background: #f0f0f0;
        }

        .reply-container {
            margin-top: 6px;
            padding-left: 8px;
            border-left: 2px solid #d87a93;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .reply-item {
            background: #fce8ec;
            padding: 6px;
            border-radius: 8px;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* ADMIN MODAL */
        #admin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .admin-content {
            background: #2b131c;
            width: 100%;
            max-width: 450px;
            border-radius: 18px;
            padding: 15px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 85vh;
            overflow-y: auto;
            border: 3px solid var(--main-pink);
        }
    </style>
</head>
<body>

<div id="game-container">

    <!-- 1. INTRO SCREEN -->
    <div id="intro-screen" class="screen active">
        <h1 class="title-exact-match" style="font-size: 1.4rem;">IS SEONGHYEON A CAT?</h1>
        <div class="video-box" id="intro-video-wrapper">
            <!-- Video intro tự động lặp lại liên tục (loop) -->
            <video id="main-intro-video" src="intro-video.mp4" autoplay loop playsinline controls preload="auto"></video>
        </div>
        <div class="btn-group">
            <button class="custom-btn" onclick="replayIntroMainVideo()">REPLAY INTRO</button>
            <button class="custom-btn primary" onclick="skipIntroToStageSelect()">Start Game ➔</button>
        </div>
    </div>

    <!-- 2. SELECT STAGE SCREEN -->
    <div id="stage-select-screen" class="screen">
        <div class="vertical-title title-exact-match">SELECT STAGE</div>
        <div class="stages-scroll-area">
            <!-- EASY -->
            <div class="stage-card-item" onclick="startGame(1)" onmouseenter="playLevelHover(1)" onmouseleave="stopLevelHover(1)">
                <div class="stage-media-wrapper">
                    <img id="level-img-1" src="stage1-easy-img.jpg" alt="EASY">
                    <video id="level-vid-1" src="stage1-easy-video.mp4" loop playsinline style="display:none;"></video>
                </div>
                <h3>EASY</h3>
            </div>
            <!-- MEDIUM -->
            <div class="stage-card-item" onclick="startGame(2)" onmouseenter="playLevelHover(2)" onmouseleave="stopLevelHover(2)">
                <div class="stage-media-wrapper">
                    <img id="level-img-2" src="stage2-medium-img.jpg" alt="MEDIUM">
                    <video id="level-vid-2" src="stage2-medium-video.mp4" loop playsinline style="display:none;"></video>
                </div>
                <h3>MEDIUM</h3>
            </div>
            <!-- HARD -->
            <div class="stage-card-item" onclick="startGame(3)" onmouseenter="playLevelHover(3)" onmouseleave="stopLevelHover(3)">
                <div class="stage-media-wrapper">
                    <img id="level-img-3" src="stage3-hard-img.jpg" alt="HARD">
                    <video id="level-vid-3" src="stage3-hard-video.mp4" loop playsinline style="display:none;"></video>
                </div>
                <h3>HARD</h3>
            </div>
        </div>
    </div>

    <!-- 3. GAMEPLAY SCREEN -->
    <header id="game-header" class="game-top-bar" style="display:none; position:absolute; top:10px; left:10px; width:calc(100% - 20px); z-index:20;">
        <button class="top-btn" onclick="goToStageSelect()">🏠 SELECT</button>
        <div class="stage-info-title" id="stage-indicator">STAGE 1</div>
        <div class="game-stats">
            <span id="timer-display">00:00</span>
            <span id="moves-display">0</span>
        </div>
        <button class="top-btn" onclick="toggleSound()">
            <i id="sound-icon" class="fa-solid fa-volume-high"></i>
        </button>
    </header>

    <div id="game-main-area" class="screen" style="justify-content:center;">
        <div class="preview-banner" id="preview-countdown-box">Preview Time: <span id="preview-countdown">3s</span></div>
        <div class="cards-grid" id="game-board"></div>
    </div>

    <!-- 4. VICTORY SCREEN -->
    <div id="victory-modal" class="screen" style="justify-content:center; z-index:30;">
        <div class="text-yellow-600 text-3xl mb-1"><i class="fa-solid fa-trophy"></i></div>
        <div class="text-[0.65rem] font-bold text-emerald-700 tracking-widest uppercase font-vietnamese">Stage Cleared!</div>
        <h2 class="title-exact-match" id="victory-question">IS SEONGHYEON A CAT?</h2>
        <div class="victory-img-box">
            <img id="victory-stage-img" src="" alt="Victory">
        </div>
        <div class="victory-buttons" style="width:100%;">
            <button id="victory-action-btn" onclick="handleVictoryNext()" class="custom-btn primary" style="width:100%; border-radius:14px; padding:12px;">ABSOLUTELY ➔</button>
        </div>
        <div id="bonus-choice-buttons" class="victory-buttons hidden" style="width:100%;">
            <button onclick="handleBonusChoice('NO')" class="btn-no">NO</button>
            <button onclick="handleBonusChoice('YES')" class="btn-yes">YES</button>
        </div>
    </div>

    <!-- 5. RESULT MEDIA & COMMENT SCREEN (YES/NO) -->
    <div id="media-display-modal" class="screen" style="z-index:40;">
        <button onclick="closeMediaDisplayModal()" style="position:absolute; top:12px; right:12px; width:32px; height:32px; background:var(--dark-burgundy); color:#fff; border-radius:50%; border:none; font-weight:bold; cursor:pointer; z-index:50;">✕</button>
        
        <!-- Video YES/NO luôn tự động lặp lại (loop) liên tục -->
        <div id="media-display-content" class="video-box" style="width:100%;"></div>

        <!-- Khung bình luận (Mặc định ẩn, chỉ hiện sau khi bấm nút lần 1) -->
        <div id="comment-section-box" class="comment-section-box hidden">
            <h3 class="title-exact-match" style="font-size:0.9rem;">LIVE YOUR COMMENTS</h3>
            <input type="text" id="comment-name" class="name-input font-vietnamese" placeholder="Your name...">
            <div class="comment-row-action">
                <input type="text" id="comment-text" class="comment-input font-vietnamese" placeholder="Write a comment...">
                <button class="send-btn" onclick="postUserComment()">Send</button>
            </div>
            <div class="comments-list font-vietnamese" id="comments-list"></div>
        </div>

        <button id="result-action-button" onclick="handleResultActionButtonClick()" class="custom-btn primary" style="width:100%; margin-top:10px; flex-shrink:0;">EM CHIP CAM ON</button>
    </div>

</div>

<!-- ADMIN MODAL QUẢN LÝ BÌNH LUẬN -->
<div id="admin-modal">
    <div class="admin-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 class="title-exact-match" style="color:#fff; font-size:1rem;">ADMIN: QUẢN LÝ BÌNH LUẬN</h3>
            <button onclick="closeAdminModal()" style="background:none; border:none; color:#fff; font-size:1.1rem; cursor:pointer;">✕</button>
        </div>
        <p style="font-size:0.75rem; color:#f0d0d5;">Danh sách toàn bộ bình luận của người chơi (Xóa riêng lẻ từng bình luận):</p>
        <div id="admin-comments-list" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto;"></div>
    </div>
</div>

<audio id="stage-bgm-audio" loop></audio>

<script>
    let currentStage = 1;
    let secondsElapsed = 0;
    let movesCount = 0;
    let timerInterval = null;
    let previewInterval = null;
    let soundEnabled = true;
    let flippedCards = [];
    let matchedPairsCount = 0;
    let isProcessing = false;
    let totalPairsInStage = 2;
    let currentChoiceVote = 'YES';
    let resultActionState = 0; // 0: Mới hiện video + nút, 1: Bấm lần 1 hiện cmt, 2: Bấm lần 2 về intro
    let userCommentsList = [];
    let replyingToUser = null;

    const stageTitles = { 1: 'STAGE 1: SKEPTICAL', 2: 'STAGE 2: TENTATIVE', 3: 'STAGE 3: CONVINCED', 4: 'STAGE BONUS: UNSHAKABLE' };
    const victoryQuestions = { 1: 'ARE YOU STILL SKEPTICAL?', 2: 'HAVE YOU STARTED TO BELIEVE?', 3: 'ARE YOU FULLY CONVINCED NOW?', 4: 'IS SEONGHYEON A CAT?' };
    const victoryBtnLabels = { 1: 'NOT SURE ➔', 2: 'A LITTLE ➔', 3: 'ABSOLUTELY ➔' };

    let stageCovers = { 1: 'card-back-1-2-3-bonus.jpg', 2: 'card-back-1-2-3-bonus.jpg', 3: 'card-back-1-2-3-bonus.jpg', 4: 'card-back-1-2-3-bonus.jpg' };
    let stageVictoryImages = { 1: 'victory1-img.png', 2: 'victory2-img.png', 3: 'victory3-img.png', 4: 'victory-bonus-img.png' };
    let stageBGMTracks = { 1: 'stage1-audio.mp3', 2: 'stage2-audio.mp3', 3: 'stage3-audio.mp3', 4: 'stage-bonus-audio.mp3' };
    
    let stageCardPhotos = {
        1: ['stage1-card-1.jpg', 'stage1-card-2.jpg', 'stage1-card-3.png', 'stage1-card-4.jpg'],
        2: ['stage2-card-1.jpg', 'stage2-card-2.jpg', 'stage2-card-3.jpg', 'stage2-card-4.jpg', 'stage2-card-5.jpg', 'stage2-card-6.jpg', 'stage2-card-7.jpg', 'stage2-card-8.jpg'],
        3: ['stage3-card-1.jpg', 'stage3-card-2.jpg', 'stage3-card-3.jpg', 'stage3-card-4.jpg', 'stage3-card-5.jpg', 'stage3-card-6.jpg', 'stage3-card-7.jpg', 'stage3-card-8.jpg', 'stage3-card-9.jpg', 'stage3-card-10.jpg', 'stage3-card-11.jpg', 'stage3-card-12.jpg'],
        4: ['bonus-card-1.jpg', 'bonus-card-2.jpg', 'bonus-card-3.jpg', 'bonus-card-4.jpg', 'bonus-card-5.png', 'bonus-card-6.jpg', 'bonus-card-7.jpg', 'bonus-card-8.jpg', 'bonus-card-9.jpg', 'bonus-card-10.png', 'bonus-card-11.jpg', 'bonus-card-12.jpg', 'bonus-card-13.png', 'bonus-card-14.jpg', 'bonus-card-15.png', 'bonus-card-16.jpg', 'bonus-card-17.jpg', 'bonus-card-18.jpg', 'bonus-card-19.jpg', 'bonus-card-20.jpg']
    };

    let stageMatchingPairs = {
        1: { 0: 0, 3: 0, 1: 1, 2: 1 },
        2: { 0: 0, 6: 0, 1: 1, 7: 1, 2: 2, 5: 2, 3: 3, 4: 3 },
        3: { 0: 0, 6: 0, 1: 1, 8: 1, 2: 2, 11: 2, 3: 3, 4: 3, 5: 4, 10: 4, 7: 5, 9: 5 },
        4: { 0: 0, 16: 0, 1: 1, 9: 1, 2: 2, 15: 2, 3: 3, 5: 3, 4: 4, 14: 4, 7: 5, 19: 5, 6: 6, 13: 6, 8: 7, 11: 7, 12: 8, 18: 8, 10: 9, 17: 9 }
    };

    let resultChoiceMedia = {
        YES: { type: 'video', video: 'yes-button-video.mp4' },
        NO: { type: 'video', video: 'no-button-video.mp4' }
    };

    // Load dữ liệu bình luận từ localStorage để không bị mất khi F5
    function loadComments() {
        const saved = localStorage.getItem('seonghyeon_comments_v3');
        if (saved) {
            try { userCommentsList = JSON.parse(saved); } catch(e) { userCommentsList = []; }
        }
    }

    function saveComments() {
        localStorage.setItem('seonghyeon_comments_v3', JSON.stringify(userCommentsList));
    }

    function showIntroScreen() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('intro-screen').classList.add('active');
        document.getElementById('game-header').style.display = 'none';
        closeMediaDisplayModal();
        const introVid = document.getElementById('main-intro-video');
        if(introVid) { introVid.currentTime = 0; introVid.play().catch(()=>{}); }
    }

    function skipIntroToStageSelect() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('stage-select-screen').classList.add('active');
        document.getElementById('game-header').style.display = 'none';
    }

    function replayIntroMainVideo() {
        const vid = document.getElementById('main-intro-video');
        if(vid) { vid.currentTime = 0; vid.play().catch(()=>{}); }
    }

    function goToStageSelect() {
        stopTimer();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('stage-select-screen').classList.add('active');
        document.getElementById('game-header').style.display = 'none';
        closeMediaDisplayModal();
    }

    function closeMediaDisplayModal() {
        const container = document.getElementById('media-display-content');
        if(container) container.innerHTML = '';
        document.getElementById('media-display-modal').classList.remove('active');
    }

    function playLevelHover(lvl) {
        const vid = document.getElementById(`level-vid-${lvl}`);
        const img = document.getElementById(`level-img-${lvl}`);
        if(vid && img) {
            img.style.display = 'none';
            vid.style.display = 'block';
            vid.muted = false;
            vid.play().catch(()=>{});
        }
    }

    function stopLevelHover(lvl) {
        const vid = document.getElementById(`level-vid-${lvl}`);
        const img = document.getElementById(`level-img-${lvl}`);
        if(vid && img) {
            vid.pause();
            vid.currentTime = 0;
            vid.style.display = 'none';
            img.style.display = 'block';
        }
    }

    function startGame(stage) {
        currentStage = stage;
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('game-main-area').classList.add('active');
        document.getElementById('game-header').style.display = 'flex';
        document.getElementById('stage-indicator').innerText = stageTitles[stage];

        secondsElapsed = 0;
        movesCount = 0;
        updateHeaderStats();
        stopTimer();
        playBGM(stage);
        setupBoard(stage);
    }

    function playBGM(stage) {
        const bgm = document.getElementById('stage-bgm-audio');
        if(bgm && stageBGMTracks[stage] && soundEnabled) {
            bgm.src = stageBGMTracks[stage];
            bgm.currentTime = 0;
            bgm.play().catch(()=>{});
        }
    }

    function stopBGM() {
        const bgm = document.getElementById('stage-bgm-audio');
        if(bgm) { bgm.pause(); bgm.currentTime = 0; }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const icon = document.getElementById('sound-icon');
        icon.className = soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark";
        if(!soundEnabled) stopBGM(); else playBGM(currentStage);
    }

    function startTimer() {
        stopTimer();
        timerInterval = setInterval(() => {
            secondsElapsed++;
            updateHeaderStats();
        }, 1000);
    }

    function stopTimer() {
        if(timerInterval) clearInterval(timerInterval);
        if(previewInterval) clearInterval(previewInterval);
    }

    function updateHeaderStats() {
        const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
        const secs = (secondsElapsed % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${mins}:${secs}`;
        document.getElementById('moves-display').innerText = movesCount;
    }

    function setupBoard(stage) {
        const board = document.getElementById('game-board');
        board.innerHTML = '';
        const photos = stageCardPhotos[stage];
        const pairsMap = stageMatchingPairs[stage];
        totalPairsInStage = stage === 1 ? 2 : (stage === 2 ? 4 : (stage === 3 ? 6 : 10));
        board.className = `cards-grid grid-stage-${stage === 4 ? 'bonus' : stage}`;

        let deck = photos.map((imgUrl, idx) => ({
            index: idx,
            img: imgUrl,
            pairId: pairsMap[idx] !== undefined ? pairsMap[idx] : idx
        }));

        flippedCards = [];
        matchedPairsCount = 0;
        isProcessing = true;
        const coverImage = stageCovers[stage];

        deck.forEach(cardData => {
            const cardEl = document.createElement('div');
            cardEl.className = "card";
            cardEl.dataset.index = cardData.index;
            cardEl.dataset.pair = cardData.pairId;
            cardEl.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">
                        <img src="${cardData.img}" alt="card">
                    </div>
                    <div class="card-back">
                        <img src="${coverImage}" alt="back">
                    </div>
                </div>
            `;
            cardEl.onclick = () => handleCardClick(cardEl);
            board.appendChild(cardEl);
        });

        let previewSec = stage === 4 ? 5 : 3;
        const previewEl = document.getElementById('preview-countdown');
        const previewBox = document.getElementById('preview-countdown-box');
        previewBox.style.display = 'block';
        previewEl.innerText = `${previewSec}s`;

        clearInterval(previewInterval);
        previewInterval = setInterval(() => {
            previewSec--;
            previewEl.innerText = `${previewSec}s`;
            if(previewSec <= 0) {
                clearInterval(previewInterval);
                previewBox.style.display = 'none';
                document.querySelectorAll('.card-inner').forEach(c => c.classList.remove('rotate-y-180'));
                isProcessing = false;
                startTimer();
            }
        }, 1000);
    }

    function handleCardClick(cardEl) {
        if(isProcessing) return;
        const inner = cardEl.querySelector('.card-inner');
        if(inner.classList.contains('rotate-y-180') && flippedCards.length < 2) {
            inner.classList.remove('rotate-y-180');
            flippedCards.push(cardEl);

            if(flippedCards.length === 2) {
                movesCount++;
                updateHeaderStats();
                isProcessing = true;
                const c1 = flippedCards[0];
                const c2 = flippedCards[1];

                if(c1.dataset.pair === c2.dataset.pair && c1.dataset.index !== c2.dataset.index) {
                    matchedPairsCount++;
                    flippedCards = [];
                    isProcessing = false;
                    if(matchedPairsCount === totalPairsInStage) {
                        setTimeout(handleStageVictory, 400);
                    }
                } else {
                    setTimeout(() => {
                        c1.querySelector('.card-inner').classList.add('rotate-y-180');
                        c2.querySelector('.card-inner').classList.add('rotate-y-180');
                        flippedCards = [];
                        isProcessing = false;
                    }, 600);
                }
            }
        }
    }

    function handleStageVictory() {
        stopTimer();
        stopBGM();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('victory-modal').classList.add('active');

        document.getElementById('victory-question').innerText = victoryQuestions[currentStage];
        const vicImg = document.getElementById('victory-stage-img');
        vicImg.src = stageVictoryImages[currentStage];

        const actionBtn = document.getElementById('victory-action-btn');
        const bonusBtns = document.getElementById('bonus-choice-buttons');

        if(currentStage === 4) {
            actionBtn.style.display = 'none';
            bonusBtns.classList.remove('hidden');
        } else {
            bonusBtns.classList.add('hidden');
            actionBtn.style.display = 'block';
            actionBtn.innerText = victoryBtnLabels[currentStage];
        }
    }

    function handleVictoryNext() {
        if(currentStage < 4) startGame(currentStage + 1);
    }

    function handleBonusChoice(choice) {
        currentChoiceVote = choice.toUpperCase();
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('media-display-modal').classList.add('active');

    function handleResultActionButtonClick() {
        const commentBox = document.getElementById('comment-section-box');
        const actionBtn = document.getElementById('result-action-button');

        if(resultActionState === 0) {
            // Lần bấm thứ 1: Hiện khung bình luận
            resultActionState = 1;
            commentBox.classList.remove('hidden');
            commentBox.scrollIntoView({ behavior: 'smooth' });

    // Sắp xếp bình luận: Ưu tiên nhiều tym nhất lên đầu, sau đó đến mới nhất
    function getSortedComments() {
        return [...userCommentsList].sort((a, b) => (b.likes || 0) - (a.likes || 0));
    }

    function renderCommentsList() {
        const listContainer = document.getElementById('comments-list');
        if(!listContainer) return;
        const sorted = getSortedComments();
        
        if(sorted.length === 0) {
            listContainer.innerHTML = '<div class="text-[0.7rem] text-gray-500 italic text-center py-2 font-vietnamese">No comments yet. Be the first one!</div>';
            return;
        }

        listContainer.innerHTML = sorted.map((c) => {
            let originalIndex = userCommentsList.findIndex(item => item.id === c.id);
            let repliesHtml = (c.replies || []).map((rep, rIndex) => `
                <div class="reply-item">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <b>${rep.name} <span class="voted-badge ${rep.vote === 'NO' ? 'no' : ''}">voted ${rep.vote}</span></b>
                        <button onclick="deleteReply(${originalIndex}, ${rIndex})" style="background:none;border:none;color:#e74c3c;cursor:pointer;font-weight:bold;">✕</button>
                    </div>
                    <div><b>@${rep.replyTo}</b> ${rep.text}</div>
                    <div class="comment-footer-actions">
                        <span class="action-like ${rep.liked ? 'liked' : ''}" onclick="likeReply(${originalIndex}, ${rIndex})">
                            <i class="${rep.liked ? 'fas' : 'far'} fa-heart"></i> ${rep.likes || 0}
                        </span>
                        <span class="action-reply" onclick="promptReply(${originalIndex}, '${rep.name}')">Reply</span>
                    </div>
                </div>
            `).join('');

            return `
                <div class="comment-item">
                    <div class="comment-header">
                        <span>${c.name}</span>
                        <span class="voted-badge ${c.vote === 'NO' ? 'no' : ''}">voted ${c.vote}</span>
                        <button class="comment-menu-btn" onclick="toggleCommentMenu(${originalIndex})">⋮</button>
                        <div class="comment-dropdown" id="comment-menu-${originalIndex}">
                            <button onclick="deleteComment(${originalIndex})">Delete</button>
                        </div>
                    </div>
                    <div class="comment-body">${c.text}</div>
                    <div class="comment-footer-actions">
                        <span class="action-like ${c.liked ? 'liked' : ''}" onclick="likeComment(${originalIndex})">
                            <i class="${c.liked ? 'fas' : 'far'} fa-heart"></i> ${c.likes || 0}
                        </span>
                        <span class="action-reply" onclick="promptReply(${originalIndex}, '${c.name}')">Reply</span>
                    </div>
                    ${repliesHtml ? `<div class="reply-container">${repliesHtml}</div>` : ''}
                </div>
            `;
        }).join('');
    }

    function postUserComment() {
        const nameInput = document.getElementById('comment-name');
        const textInput = document.getElementById('comment-text');
        if(!textInput.value.trim()) return;

        if (replyingToUser) {
            // Reply theo dạng quote @tên_người_được_reply
            const parentCmt = userCommentsList[replyingToUser.parentIndex];
            if (parentCmt) {
                if (!parentCmt.replies) parentCmt.replies = [];
                parentCmt.replies.push({
                    name: nameInput.value.trim() || 'Anonymous',
                    vote: currentChoiceVote,
                    replyTo: replyingToUser.targetName,
                    text: textInput.value.trim(),
                    likes: 0,
                    liked: false
                });
            }
            replyingToUser = null;
            textInput.placeholder = "Write a comment...";
        } else {
            userCommentsList.unshift({
                id: Date.now(),
                name: nameInput.value.trim() || 'Anonymous',
                vote: currentChoiceVote,
                text: textInput.value.trim(),
                likes: 0,
                liked: false,
                replies: []
            });
        }
        textInput.value = '';
        saveComments();
        renderCommentsList();
    }

    function toggleCommentMenu(index) {
        document.querySelectorAll('.comment-dropdown').forEach((d, idx) => {
            if(idx !== index) d.style.display = 'none';
        });
        const menu = document.getElementById(`comment-menu-${index}`);
        menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    function likeComment(index) {
        let c = userCommentsList[index];
        if(c.liked) {
            c.liked = false;
            c.likes = Math.max(0, (c.likes || 1) - 1);
        } else {
            c.liked = true;
            c.likes = (c.likes || 0) + 1;
        }
        saveComments();
        renderCommentsList();
    }

    function promptReply(parentIndex, targetName) {
        replyingToUser = { parentIndex, targetName };
        const textInput = document.getElementById('comment-text');
        textInput.placeholder = `Replying to @${targetName}...`;
        textInput.focus();
    }

    function likeReply(parentIndex, replyIndex) {
        let rep = userCommentsList[parentIndex].replies[replyIndex];
        if(rep.liked) {
            rep.liked = false;
            rep.likes = Math.max(0, (rep.likes || 1) - 1);
        } else {
            rep.liked = true;
            rep.likes = (rep.likes || 0) + 1;
        }
        saveComments();
        renderCommentsList();
    }

    function deleteComment(index) {
        userCommentsList.splice(index, 1);
        saveComments();
        renderCommentsList();
    }
