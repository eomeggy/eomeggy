<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MINI GAMES - CAT & SANTA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fce8ee;
            font-family: 'Titan One', cursive, sans-serif;
            color: #4a152b;
        }

        /* Màn hình chọn khi cả 2 game cùng mở */
        #game-picker {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            padding: 20px;
            background: linear-gradient(180deg, #fff2f6 0%, #f8d2e0 100%);
            text-align: center;
        }

        #game-picker.visible {
            display: flex;
        }

        .picker-title {
            margin: 0;
            font-size: clamp(26px, 5vw, 48px);
            letter-spacing: 0.04em;
            color: #4a152b;
            text-shadow:
                -2px -2px 0 #fff5f8,
                 2px -2px 0 #fff5f8,
                -2px  2px 0 #fff5f8,
                 2px  2px 0 #fff5f8,
                 0px  4px 0 rgba(74, 21, 43, 0.16);
        }

        .picker-buttons {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 18px;
        }

        .pick-card-btn {
            font-family: 'Titan One', cursive, sans-serif;
            font-size: clamp(20px, 3.2vw, 30px);
            letter-spacing: 0.05em;
            padding: 18px 34px;
            border-radius: 20px;
            border: 3.5px solid #4a152b;
            cursor: pointer;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .pick-card-btn:active {
            transform: translateY(3px);
        }

        #pick-cat-btn {
            background: #ffffff;
            color: #4a152b;
            box-shadow: 0 6px 0 #4a152b;
        }

        #pick-santa-btn {
            background: #e11d48;
            color: #fff5f8;
            box-shadow: 0 6px 0 #881337;
        }

        /* Thông báo khi chưa có game nào được mở */
        #no-game-notice {
            position: fixed;
            inset: 0;
            z-index: 15;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, #fff2f6 0%, #f8d2e0 100%);
        }

        #no-game-notice.visible {
            display: flex;
        }

        .notice-box {
            background: #ffffff;
            border: 3px solid #4a152b;
            border-radius: 20px;
            padding: 22px 28px;
            max-width: 440px;
            box-shadow: 0 6px 0 #4a152b;
            font-size: clamp(16px, 2.5vw, 22px);
            line-height: 1.4;
        }

        /* Khung game toàn màn hình, không đè nút điều hướng lên game */
        #app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        #app-frame.visible {
            display: block;
        }

        /* Modal Admin Setting (mở bằng Shift + U) */
        #admin-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(38, 7, 20, 0.55);
            backdrop-filter: blur(3px);
        }

        #admin-overlay.visible {
            display: flex;
        }

        .admin-panel {
            width: min(420px, 94vw);
            background: #fff8fa;
            border: 3.5px solid #4a152b;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 10px 28px rgba(38, 7, 20, 0.35);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px dashed rgba(74, 21, 43, 0.25);
            padding-bottom: 10px;
        }

        .admin-title {
            margin: 0;
            font-size: 20px;
            letter-spacing: 0.04em;
        }

        #close-admin-btn {
            font-family: 'Titan One', cursive, sans-serif;
            font-size: 13px;
            padding: 5px 11px;
            border-radius: 10px;
            border: 2px solid #4a152b;
            background: #ffffff;
            color: #4a152b;
            cursor: pointer;
        }

        .admin-game-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: #ffffff;
            border: 2.5px solid #4a152b;
            border-radius: 16px;
            padding: 12px 16px;
        }

        .admin-game-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .admin-game-name {
            font-size: 18px;
            letter-spacing: 0.04em;
        }

        .admin-game-status {
            font-size: 11px;
            opacity: 0.75;
        }

        .admin-open-btn {
            font-family: 'Titan One', cursive, sans-serif;
            font-size: 14px;
            letter-spacing: 0.05em;
            padding: 9px 18px;
            border-radius: 12px;
            border: 2.5px solid #4a152b;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.15s ease, color 0.15s ease;
        }

        .admin-open-btn:active {
            transform: translateY(2px);
        }

        .admin-open-btn.is-open {
            background: #16a34a;
            color: #ffffff;
            box-shadow: 0 3px 0 #14532d;
        }

        .admin-open-btn.is-closed {
            background: #e5e7eb;
            color: #4a152b;
            box-shadow: 0 3px 0 #4a152b;
        }

        .admin-hint {
            font-size: 11px;
            text-align: center;
            opacity: 0.8;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <!-- Màn hình hiển thị 2 nút CAT & SANTA khi cả 2 game đều đang mở -->
    <div id="game-picker">
        <h1 class="picker-title">CHOOSE A GAME</h1>
        <div class="picker-buttons">
            <button id="pick-cat-btn" type="button" class="pick-card-btn" onclick="launchGame('CAT')">CAT</button>
            <button id="pick-santa-btn" type="button" class="pick-card-btn" onclick="launchGame('SANTA')">SANTA</button>
        </div>
    </div>

    <!-- Thông báo nếu cả 2 game đều đang đóng -->
    <div id="no-game-notice">
        <div class="notice-box">NO GAME IS OPEN RIGHT NOW</div>
    </div>

    <!-- Khung hiển thị game -->
    <iframe id="app-frame" src="" allow="autoplay"></iframe>

    <!-- Admin Setting Modal (Shift + U) -->
    <div id="admin-overlay" aria-hidden="true">
        <div class="admin-panel" role="dialog" aria-modal="true" aria-label="Admin Setting">
            <div class="admin-header">
                <h2 class="admin-title">ADMIN SETTING</h2>
                <button id="close-admin-btn" type="button" onclick="toggleAdminModal(false)">CLOSE</button>
            </div>

            <div class="admin-game-row">
                <div class="admin-game-info">
                    <span class="admin-game-name">CAT</span>
                    <span id="status-text-cat" class="admin-game-status">pc.html / phone.html</span>
                </div>
                <button id="open-btn-cat" type="button" class="admin-open-btn is-open" onclick="toggleGameOpenState('CAT')">OPEN</button>
            </div>

            <div class="admin-game-row">
                <div class="admin-game-info">
                    <span class="admin-game-name">SANTA</span>
                    <span id="status-text-santa" class="admin-game-status">santa-game</span>
                </div>
                <button id="open-btn-santa" type="button" class="admin-open-btn is-open" onclick="toggleGameOpenState('SANTA')">OPEN</button>
            </div>

            <div class="admin-hint">
                PRESS SHIFT + U TO TOGGLE ADMIN SETTING.<br>
                WHEN 1 GAME IS OPEN, VISITORS GO DIRECTLY TO THAT GAME.
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'admin_game_open_config_v1';

        let gameOpenConfig = {
            CAT: true,
            SANTA: true
        };

        function loadGameOpenConfig() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    gameOpenConfig = {
                        CAT: typeof parsed.CAT === 'boolean' ? parsed.CAT : true,
                        SANTA: typeof parsed.SANTA === 'boolean' ? parsed.SANTA : true
                    };
                }
            } catch (_) {}
        }

        function saveGameOpenConfig() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(gameOpenConfig));
            } catch (_) {}
        }

        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
        }

        function getCatTargetUrl() {
            return isMobileDevice() ? 'phone.html' : 'pc.html';
        }

        function resolveSantaTargetUrl(callback) {
            const primary = 'santa-game/index.html';
            const fallback = 'santa-game/what_will_santa_bring_chip.html';
            fetch(primary, { method: 'HEAD', cache: 'no-store' })
                .then((res) => callback(res.ok ? primary : fallback))
                .catch(() => callback(fallback));
        }

        function launchGame(gameKey) {
            if (!gameOpenConfig[gameKey]) return;

            const picker = document.getElementById('game-picker');
            const notice = document.getElementById('no-game-notice');
            const frame = document.getElementById('app-frame');

            picker.classList.remove('visible');
            notice.classList.remove('visible');
            frame.classList.add('visible');

            if (gameKey === 'CAT') {
                frame.src = getCatTargetUrl();
            } else if (gameKey === 'SANTA') {
                resolveSantaTargetUrl((url) => {
                    frame.src = url;
                });
            }
        }

        function applyRoutingByOpenGames() {
            const picker = document.getElementById('game-picker');
            const notice = document.getElementById('no-game-notice');
            const frame = document.getElementById('app-frame');

            const catOpen = !!gameOpenConfig.CAT;
            const santaOpen = !!gameOpenConfig.SANTA;

            if (catOpen && santaOpen) {
                // Cả 2 game đều được mở -> hiện 2 nút CAT và SANTA từ đầu
                frame.classList.remove('visible');
                frame.src = '';
                notice.classList.remove('visible');
                picker.classList.add('visible');
            } else if (catOpen && !santaOpen) {
                // Chỉ mở CAT -> vào thẳng game CAT, không hiện 2 nút chọn
                launchGame('CAT');
            } else if (!catOpen && santaOpen) {
                // Chỉ mở SANTA -> vào thẳng game SANTA, không hiện 2 nút chọn
                launchGame('SANTA');
            } else {
                // Cả 2 game đều đang tắt
                picker.classList.remove('visible');
                frame.classList.remove('visible');
                frame.src = '';
                notice.classList.add('visible');
            }
        }

        function syncAdminUI() {
            const catBtn = document.getElementById('open-btn-cat');
            const santaBtn = document.getElementById('open-btn-santa');
            const catStatus = document.getElementById('status-text-cat');
            const santaStatus = document.getElementById('status-text-santa');

            catBtn.classList.toggle('is-open', gameOpenConfig.CAT);
            catBtn.classList.toggle('is-closed', !gameOpenConfig.CAT);
            catBtn.textContent = gameOpenConfig.CAT ? 'OPEN' : 'CLOSED';
            catStatus.textContent = gameOpenConfig.CAT ? 'OPEN FOR PLAYERS' : 'NOT OPENED';

            santaBtn.classList.toggle('is-open', gameOpenConfig.SANTA);
            santaBtn.classList.toggle('is-closed', !gameOpenConfig.SANTA);
            santaBtn.textContent = gameOpenConfig.SANTA ? 'OPEN' : 'CLOSED';
            santaStatus.textContent = gameOpenConfig.SANTA ? 'OPEN FOR PLAYERS' : 'NOT OPENED';
        }

        function toggleGameOpenState(gameKey) {
            if (!(gameKey in gameOpenConfig)) return;
            gameOpenConfig[gameKey] = !gameOpenConfig[gameKey];
            saveGameOpenConfig();
            syncAdminUI();
            applyRoutingByOpenGames();
        }

        function toggleAdminModal(forceState) {
            const overlay = document.getElementById('admin-overlay');
            const shouldShow = typeof forceState === 'boolean'
                ? forceState
                : !overlay.classList.contains('visible');
            overlay.classList.toggle('visible', shouldShow);
            overlay.setAttribute('aria-hidden', shouldShow ? 'false' : 'true');
            if (shouldShow) {
                syncAdminUI();
            }
        }

        function handleShiftUKey(event) {
            if (event.shiftKey && !event.ctrlKey && !event.altKey && !event.metaKey && (event.key === 'U' || event.key === 'u' || event.code === 'KeyU')) {
                event.preventDefault();
                toggleAdminModal();
            }
        }

        // Bắt Shift + U ở trang cha và cả bên trong iframe (nếu cùng origin)
        window.addEventListener('keydown', handleShiftUKey);

        const appFrame = document.getElementById('app-frame');
        appFrame.addEventListener('load', () => {
            try {
                if (appFrame.contentWindow) {
                    appFrame.contentWindow.addEventListener('keydown', handleShiftUKey);
                }
            } catch (_) {}
        });

        window.addEventListener('load', () => {
            loadGameOpenConfig();
            syncAdminUI();
            applyRoutingByOpenGames();
        });
    </script>
</body>
</html>
