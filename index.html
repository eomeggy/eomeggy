<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Is Seonghyeon a Cat Game</title>
    <!-- Google Fonts: Titan One & Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pink: #f8d7da;
            --main-pink: #d87a93;
            --dark-burgundy: #592233;
            --card-pink: #ffc0cb;
            --glow-color: rgba(255, 255, 255, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Mobile Container Frame */
        #game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--main-pink);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        @media (min-width: 423px) {
            #game-container {
                border-radius: 30px;
                border: 8px solid #c25e79;
            }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-pink);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
            display: none;
            z-index: 1;
        }

        .screen.active {
            display: flex;
            z-index: 10;
        }

        /* Titan One Font & Glow Effect */
        .glow-text {
            font-family: 'Titan One', cursive;
            color: var(--dark-burgundy);
            text-shadow: 0 0 8px var(--glow-color), 0 0 15px rgba(255, 255, 255, 0.5);
            text-align: center;
        }

        /* INTRO SCREEN */
        #intro-screen {
            justify-content: center;
            gap: 20px;
        }

        #intro-screen h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .video-box {
            width: 90%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            border: 4px solid #fff;
        }

        .video-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            width: 90%;
            justify-content: center;
        }

        .custom-btn {
            font-family: 'Titan One', cursive;
            background-color: #fff;
            color: var(--dark-burgundy);
            border: none;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .custom-btn:active {
            transform: scale(0.96);
        }

        .custom-btn.primary {
            background-color: var(--dark-burgundy);
            color: #fff;
        }

        /* SELECT STAGE SCREEN */
        #select-screen {
            padding: 15px;
            overflow-y: scroll;
            position: relative;
        }

        .vertical-title {
            position: fixed;
            right: 12px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            font-family: 'Titan One', cursive;
            color: #fff;
            font-size: 1.6rem;
            letter-spacing: 3px;
            z-index: 100;
            pointer-events: none;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .stages-scroll-area {
            width: 78%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 40px;
            align-items: center;
            margin-right: 25px;
        }

        .stage-card-item {
            width: 100%;
            background: #fff;
            border-radius: 18px;
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            text-align: center;
        }

        .stage-media-wrapper {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #000;
        }

        .stage-media-wrapper img, .stage-media-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .stage-card-item h3 {
            font-family: 'Titan One', cursive;
            color: var(--dark-burgundy);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* GAMEPLAY SCREEN */
        #gameplay-screen {
            padding: 12px;
        }

        .game-top-bar {
            width: 100%;
            background: #fff;
            border-radius: 14px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }

        .top-btn {
            background: var(--dark-burgundy);
            color: #fff;
            border: none;
            padding: 6px 8px;
            border-radius: 8px;
            font-family: 'Titan One', cursive;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .stage-info-title {
            font-family: 'Titan One', cursive;
            font-size: 0.75rem;
            color: var(--dark-burgundy);
        }

        .game-stats {
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--dark-burgundy);
        }

        .preview-banner {
            background: #fff;
            padding: 6px 16px;
            border-radius: 15px;
            font-family: 'Titan One', cursive;
            color: var(--dark-burgundy);
            margin-bottom: 10px;
            font-size: 0.85rem;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        /* GRID CARDS LAYOUT */
        .cards-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 360px;
            justify-content: center;
            align-content: center;
            flex-grow: 1;
            padding-bottom: 15px;
        }

        .grid-stage-1 { grid-template-columns: repeat(2, 1fr); }
        .grid-stage-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-stage-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-stage-bonus { grid-template-columns: repeat(4, 1fr); }

        .card {
            aspect-ratio: 1/1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
        }

        .card-front {
            background-color: #ffc0cb;
            transform: rotateY(180deg);
        }

        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-back {
            background-color: var(--card-pink);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* VICTORY SCREEN */
        #victory-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 15px;
            padding: 30px;
        }

        #victory-screen h2 {
            font-family: 'Titan One', cursive;
            font-size: 1.4rem;
            color: var(--dark-burgundy);
        }

        .victory-img-box {
            width: 170px;
            height: 170px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .victory-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .victory-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }

        .btn-yes {
            background-color: #2ecc71 !important;
            color: white !important;
            flex: 1;
            padding: 12px;
            border-radius: 16px;
        }

        .btn-no {
            background-color: #e74c3c !important;
            color: white !important;
            flex: 1;
            padding: 12px;
            border-radius: 16px;
        }

        /* RESULT MEDIA & COMMENTS */
        #result-media-screen {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .comment-section-box {
            width: 100%;
            background: #fff;
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .comment-section-box h3 {
            font-family: 'Titan One', cursive;
            color: var(--dark-burgundy);
            font-size: 0.95rem;
            text-align: center;
        }

        .comment-input, .name-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid #f0d0d5;
            outline: none;
            font-size: 0.85rem;
            color: #333;
        }
