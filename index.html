    <script>
    /* ===================================================================

    const ASSETS = {

    /* Background Music Manager */
    const bgAudioEl = document.getElementById('stage-bg-audio');

    function playStageBGM(stageNum) {
      if (ASSETS.stageAudio[stageNum]) {
        bgAudioEl.src = ASSETS.stageAudio[stageNum];
        bgAudioEl.play().catch(e => console.log("BGM Play prevented:", e));
      }
    }

    function stopStageBGM() {
      bgAudioEl.pause();
      bgAudioEl.currentTime = 0;
    }

    /* ===================================================================
       GLOBAL AUDIO SYNTHESIZER (Web Audio API)
       =================================================================== */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
      }

      playTone(freq, type = 'sine', duration = 0.1, gainVal = 0.1) {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) { console.error(e); }
      }

      playCountdownTick() {
        this.playTone(800, 'triangle', 0.05, 0.15);
      }
      
      playCardClick() {
        this.playTone(400, 'sine', 0.08, 0.2);
      }

      playMatchSuccess() {
        if (this.muted) return;
        this.init();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'sine', 0.2, 0.15), idx * 80);
        });
      }

      playMatchFail() {
        if (this.muted) return;
        this.init();
        this.playTone(220, 'sawtooth', 0.25, 0.15);
        setTimeout(() => this.playTone(180, 'sawtooth', 0.3, 0.15), 150);
      }

      playVictoryFanfare() {
        if (this.muted) return;
        const notes = [440, 554.37, 659.25, 880, 659.25, 880];
        notes.forEach((freq, idx) => {
          setTimeout(() => this.playTone(freq, 'triangle', 0.3, 0.2), idx * 120);
        });
      }
    }

    const audio = new AudioEngine();

    /* ===================================================================
       STAGE CONFIGURATIONS & PAIR MAPPINGS
       =================================================================== */
    const STAGE_CONFIGS = {
      1: {
        name: "SKEPTICAL",
        title: "STAGE 1: SKEPTICAL",
        totalCards: 4,
        cols: 2,
        previewSecs: 3,

        totalCards: 20,
        cols: 4,
        previewSecs: 5,
        // (1,17), (2,10), (3,16), (4,6), (5,15), (8,20), (7,14), (9,12), (13,19), (11,18)
        pairs: {
          1: 17, 17: 1, 2: 10, 10: 2, 3: 16, 16: 3, 4: 6, 6: 4, 5: 15, 15: 5,
          8: 20, 20: 8, 7: 14, 14: 7, 9: 12, 12: 9, 13: 19, 19: 13, 11: 18, 18: 11
        },
        question: "IS SEONGHYEON A CAT?",
        isBonus: true
      }
    };

    /* Distinct placeholder images for each card ID (1 to 20) */
    const CARD_ASSETS = {};
    for (let i = 1; i <= 20; i++) {
      CARD_ASSETS[i] = `https://placehold.co/200x200/ea9abb/4a1525?text=Card+${i}`;
    }

    /* ===================================================================
       GAME STATE MANAGER
       =================================================================== */
    const GameState = {
      currentStage: 1,
      flippedCards: [],
      matchedPairsCount: 0,
      totalPairs: 0,
      isChecking: false,
      isPreviewActive: false,
      timerInterval: null,
      secondsElapsed: 0,
      userVoteChoice: 'YES', // 'YES' or 'NO'
      endingClickCount: 0
    };

    /* Navigation Helpers */
    function showSlide(slideId) {
      document.querySelectorAll('.slide').forEach(s => s.classList.add('hidden'));
      const target = document.getElementById(slideId);
      if (target) {
        target.classList.remove('hidden');
        target.classList.add('flex');
      }
      if (slideId !== 'slide-gameplay') {
        stopStageBGM();
      }
    }
    document.getElementById('btn-audio-toggle').addEventListener('click', (e) => {
      audio.muted = !audio.muted;
      bgAudioEl.muted = audio.muted;
      const icon = e.currentTarget.querySelector('i');
      icon.className = audio.muted ? "fa-solid fa-volume-xmark" : "fa-solid fa-volume-high";
    });

    function startStage(stageNum) {
      GameState.currentStage = stageNum;
      const cfg = STAGE_CONFIGS[stageNum];
      GameState.totalPairs = cfg.totalCards / 2;
      GameState.matchedPairsCount = 0;
      GameState.flippedCards = [];
      GameState.isChecking = false;
      GameState.secondsElapsed = 0;

      // Update Header Titles
      document.getElementById('game-stage-title').textContent = `STAGE ${stageNum}`;
      document.getElementById('game-stage-subtitle').textContent = cfg.name;
      document.getElementById('game-timer').textContent = "00:00";

      // Play BGM for current stage
      playStageBGM(stageNum);

      // Render Grid Cards strictly ordered by Card ID: 1 to totalCards
      const grid = document.getElementById('cards-grid');
      grid.innerHTML = '';
      grid.className = `w-full h-full max-h-[580px] grid gap-2.5 p-1 align-content-center justify-center`;

      if (cfg.cols === 2) grid.classList.add('grid-cols-2');
      if (cfg.cols === 3) grid.classList.add('grid-cols-3');
      if (cfg.cols === 4) grid.classList.add('grid-cols-4');

      const stageCardsKey = `stage${stageNum}`;

      for (let cardId = 1; cardId <= cfg.totalCards; cardId++) {
        const imgSrc = ASSETS.cards[stageCardsKey][cardId];
        const cardEl = document.createElement('div');
        cardEl.className = 'card-scene aspect-square w-full';
        cardEl.innerHTML = `
          <div class="card-inner is-flipped" data-id="${cardId}">
            <div class="card-face card-back"></div>
            <div class="card-face card-front">
              <img src="${imgSrc}" class="w-full h-full object-cover" alt="Card ${cardId}" onerror="this.src='https://placehold.co/200x200/ea9abb/4a1525?text=Card+${cardId}'">
              <div class="absolute top-1 left-1 bg-burgundy text-white text-[9px] font-titan px-1.5 py-0.5 rounded-full">${cardId}</div>
            </div>
          </div>
        `;

        cardEl.addEventListener('click', () => onCardClicked(cardEl.querySelector('.card-inner'), cardId));
        grid.appendChild(cardEl);
      }

      showSlide('slide-gameplay');
      startPreviewCountdown(cfg.previewSecs);
    }
      } else {
        audio.playMatchFail();
        setTimeout(() => {
          card1.element.classList.remove('is-flipped');
          card2.element.classList.remove('is-flipped');
          GameState.flippedCards = [];
          GameState.isChecking = false;
        }, 900);
      }
    }

    /* ===================================================================
       SLIDE 4: VICTORY SCREEN
       =================================================================== */
    function showVictoryScreen() {
      audio.playVictoryFanfare();
      const stageNum = GameState.currentStage;
      const cfg = STAGE_CONFIGS[stageNum];
      document.getElementById('victory-question').textContent = cfg.question;

      // Update Victory Image per Stage
      const victoryImgEl = document.getElementById('victory-img');
      if (ASSETS.victoryImages[stageNum]) {
        victoryImgEl.src = ASSETS.victoryImages[stageNum];
      }

      const container = document.getElementById('victory-buttons-container');
      container.innerHTML = '';

      if (cfg.isBonus) {
        // Stage Bonus has 2 choices: NO (Left, Red) & YES (Right, Green)
        container.innerHTML = `
          <button id="btn-vote-no" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-titan text-base py-3.5 px-4 rounded-full border-2 border-red-700 shadow-lg active:scale-95 transition">
            NO
          </button>
          <button id="btn-vote-yes" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-titan text-base py-3.5 px-4 rounded-full border-2 border-green-700 shadow-lg active:scale-95 transition">
            YES
          </button>
        `;

        document.getElementById('btn-vote-no').addEventListener('click', () => triggerEnding('NO'));
        document.getElementById('btn-vote-yes').addEventListener('click', () => triggerEnding('YES'));
      } else {
        // Stages 1, 2, 3 have a single progress button
        const nextBtn = document.createElement('button');
        nextBtn.className = "w-full bg-burgundy hover:bg-burgundyDark text-white font-titan text-base py-3.5 px-6 rounded-full border-2 border-burgundy shadow-lg transition active:scale-95";
        nextBtn.innerHTML = `${cfg.buttonText} <i class="fa-solid fa-arrow-right ml-1"></i>`;
        nextBtn.addEventListener('click', () => {
          audio.playCardClick();
          startStage(GameState.currentStage + 1);
        });
        container.appendChild(nextBtn);
      }

      showSlide('slide-victory');
    }

    /* ===================================================================
       SLIDE 5: ENDING & COMMENTS SECTION
       =================================================================== */
    function triggerEnding(choice) {
      audio.playCardClick();
      GameState.userVoteChoice = choice;
      GameState.endingClickCount = 0;

      const videoEl = document.getElementById('ending-video');
      const actionBtn = document.getElementById('btn-ending-action');
      const scrollArea = document.getElementById('ending-scroll-area');

      // Reset scroll position
      scrollArea.scrollTop = 0;

      if (choice === 'YES') {
        videoEl.src = document.getElementById('cfg-yes-vid').value || 'yes-button-video.mp4';
        actionBtn.textContent = "EM CHIP CAM ON";
      } else {
        videoEl.src = document.getElementById('cfg-no-vid').value || 'no-button-video.mp4';
        actionBtn.textContent = "WHY NOT ME!?";
      }

      videoEl.play().catch(e => console.log(e));
      renderComments();
      showSlide('slide-ending');
    }

    document.getElementById('btn-ending-action').addEventListener('click', () => {
      audio.playCardClick();
      GameState.endingClickCount++;

      if (GameState.endingClickCount === 1) {
        // Shift media & button upwards smoothly to expose comment section below
        const commentWrapper = document.getElementById('comment-section-wrapper');
        commentWrapper.scrollIntoView({ behavior: 'smooth' });
      } else if (GameState.endingClickCount >= 2) {
        // 2nd click redirects back to intro slide
        showSlide('slide-intro');
        introVideo.currentTime = 0;
        introVideo.play();
      }
    });

    /* Comments Management via localStorage */
    const STORAGE_KEY = 'seonghyeon_cat_comments_v1';

    function getStoredComments() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
          {
            id: 1,
            author: "ChiipFan",
            vote: "YES",
            text: "Seonghyeon 100% la chu meo dang yeu nhat qua dat!! 🐾",
            likes: 12,
            replies: [],
            time: "10 mins ago"
          }
        ];
      } catch (e) { return []; }
    }

    function saveComments(comments) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
    }

    function renderComments() {
      const comments = getStoredComments();
      const listContainer = document.getElementById('comments-list');
      <!-- Media Asset Inspector & URL Overrides -->
      <div class="mb-4 bg-gray-50 p-3 rounded-xl border border-gray-200 max-h-48 overflow-y-auto">
        <h4 class="font-titan text-xs text-burgundy mb-2">MEDIA URL CONFIGURATOR:</h4>
        <div class="space-y-2 text-xs">
          <div>
            <label class="block text-gray-600 font-bold">Intro Video URL:</label>
            <input type="text" id="cfg-intro-vid" class="w-full border p-1 rounded font-mono text-[10px]" value="intro-video.mp4">
          </div>
          <div>
            <label class="block text-gray-600 font-bold">Ending YES Media URL:</label>
            <input type="text" id="cfg-yes-vid" class="w-full border p-1 rounded font-mono text-[10px]" value="yes-button-video.mp4">
          </div>
          <div>
            <label class="block text-gray-600 font-bold">Ending NO Media URL:</label>
            <input type="text" id="cfg-no-vid" class="w-full border p-1 rounded font-mono text-[10px]" value="no-button-video.mp4">
          </div>
          <button id="btn-save-media-cfg" class="bg-burgundy text-white font-titan text-xs px-3 py-1 rounded">Save Configuration</button>
        </div>
      </div>
            <div class="flex items-center gap-2 text-gray-400 text-[10px]">
              <span>${cmt.time}</span>
              <!-- 3-Dots Admin/User Dropdown -->
              <button onclick="toggleCommentMenu(${cmt.id})" class="text-gray-500 hover:text-burgundy px-1">
                <i class="fa-solid fa-ellipsis-vertical"></i>
              </button>
            </div>
          </div>

          <p class="text-gray-700 leading-relaxed text-xs break-words">${escapeHtml(cmt.text)}</p>

          <!-- Action bar: Heart & Reply -->
          <div class="flex items-center justify-between mt-1 pt-1 border-t border-gray-100 text-[11px]">
            <button onclick="likeComment(${cmt.id})" class="text-pink-600 font-medium flex items-center gap-1 hover:scale-105 transition">
              <i class="fa-solid fa-heart"></i> <span>${cmt.likes || 0}</span>
            </button>
            <button onclick="toggleReplyInput(${cmt.id})" class="text-gray-500 font-medium hover:text-burgundy">
              Reply
            </button>
          </div>

          <!-- Comment Actions Submenu (Edit / Delete) -->
          <div id="cmt-menu-${cmt.id}" class="hidden bg-gray-50 p-2 rounded border border-gray-200 mt-1 flex gap-2 justify-end">
            <button onclick="editComment(${cmt.id})" class="text-blue-600 text-[10px] font-titan">EDIT</button>
            <button onclick="deleteComment(${cmt.id})" class="text-red-600 text-[10px] font-titan">DELETE</button>
          </div>

          <!-- Reply list -->
          <div id="replies-container-${cmt.id}" class="pl-3 border-l-2 border-pink-200 space-y-1 mt-1">
            ${(cmt.replies || []).map(r => `
              <div class="bg-pink-50/60 p-1.5 rounded text-[11px]">
                <span class="font-bold text-burgundy">${escapeHtml(r.author)}:</span>
                <span class="text-gray-700">${escapeHtml(r.text)}</span>
              </div>
            `).join('')}
          </div>

          <!-- Reply Input box -->
          <div id="reply-box-${cmt.id}" class="hidden flex gap-1 mt-1">
            <input type="text" id="reply-text-${cmt.id}" placeholder="Reply..." class="flex-1 text-[11px] px-2 py-1 border rounded">
            <button onclick="submitReply(${cmt.id})" class="bg-burgundy text-white text-[10px] font-titan px-2 py-1 rounded">SEND</button>
          </div>
        `;

        listContainer.appendChild(item);
      });
    }

    document.getElementById('btn-submit-comment').addEventListener('click', () => {
      const authorInput = document.getElementById('comment-author');
      const textInput = document.getElementById('comment-text');

      const author = authorInput.value.trim() || "Anonymous Cat";
      const text = textInput.value.trim();

      if (!text) return;

      const comments = getStoredComments();
      comments.unshift({
        id: Date.now(),
        author: author,
        vote: GameState.userVoteChoice,
        text: text,
        likes: 0,
        replies: [],
        time: "Just now"
      });

      saveComments(comments);
      textInput.value = '';
      renderComments();
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    window.likeComment = function(id) {
      const comments = getStoredComments();
      const target = comments.find(c => c.id === id);
      if (target) {
        target.likes = (target.likes || 0) + 1;
        saveComments(comments);
        renderComments();
      }
    };

    window.toggleCommentMenu = function(id) {
      const el = document.getElementById(`cmt-menu-${id}`);
      if (el) el.classList.toggle('hidden');
    };

    window.toggleReplyInput = function(id) {
      const el = document.getElementById(`reply-box-${id}`);
      if (el) el.classList.toggle('hidden');
    };

    window.submitReply = function(id) {
      const input = document.getElementById(`reply-text-${id}`);
      const text = input.value.trim();
      if (!text) return;

      const comments = getStoredComments();
      const target = comments.find(c => c.id === id);
      if (target) {
        if (!target.replies) target.replies = [];
        target.replies.push({ author: "Player", text: text });
        saveComments(comments);
        renderComments();
      }
    };

    window.deleteComment = function(id) {
      let comments = getStoredComments();
      comments = comments.filter(c => c.id !== id);
      saveComments(comments);
      renderComments();
    };

    window.editComment = function(id) {
      const comments = getStoredComments();
      const target = comments.find(c => c.id === id);
      if (target) {
        const newText = prompt("Edit your comment:", target.text);
        if (newText !== null && newText.trim() !== "") {
          target.text = newText.trim();
          saveComments(comments);
          renderComments();
        }
      }
    };

    /* ===================================================================
       ADMIN SETTINGS LOGIC (F2 / Shift+U Toggle & PIN Security)
       =================================================================== */
    const AdminState = {
      isAuthenticated: false,
      attempts: 0,
      lockoutUntil: 0,
      PASSCODE: "123456"
    };

    function toggleAdminPanel() {
      const now = Date.now();
      if (AdminState.lockoutUntil > now) {
        const remainingMins = Math.ceil((AdminState.lockoutUntil - now) / 60000);
        alert(`Admin panel locked due to multiple failed attempts! Try again in ${remainingMins} minutes.`);
        return;
      }

      if (AdminState.isAuthenticated) {
        const panel = document.getElementById('admin-panel');
        panel.classList.toggle('hidden');
      } else {
        document.getElementById('admin-auth-modal').classList.remove('hidden');
      }
    }

    // Keyboard Shortcuts: F2 or Shift + U
    window.addEventListener('keydown', (e) => {
      if (e.key === 'F2' || (e.shiftKey && (e.key === 'U' || e.key === 'u'))) {
        e.preventDefault();
        toggleAdminPanel();
      }
    });

    document.getElementById('btn-admin-close-auth').addEventListener('click', () => {
      document.getElementById('admin-auth-modal').classList.add('hidden');
    });

    document.getElementById('btn-admin-close-panel').addEventListener('click', () => {
      document.getElementById('admin-panel').classList.add('hidden');
    });

    document.getElementById('btn-admin-submit-auth').addEventListener('click', verifyAdminPin);

    function verifyAdminPin() {
      const pinInput = document.getElementById('admin-pin-input');
      const errorMsg = document.getElementById('admin-error-msg');
      const val = pinInput.value.trim();

      if (val === AdminState.PASSCODE) {
        AdminState.isAuthenticated = true;
        AdminState.attempts = 0;
        document.getElementById('admin-auth-modal').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        errorMsg.classList.add('hidden');
        pinInput.value = '';
      } else {
        AdminState.attempts++;
        if (AdminState.attempts >= 10) {
          AdminState.lockoutUntil = Date.now() + 30 * 60 * 1000; // 30 mins lock
          errorMsg.textContent = "Locked out for 30 mins due to 10 failed attempts!";
        } else {
          errorMsg.textContent = `Incorrect PIN! Attempts left: ${10 - AdminState.attempts}`;
        }
        errorMsg.classList.remove('hidden');
      }
    }

    // Admin Controller Utilities
    window.AdminController = {
      jumpTo: function(slideId) {
        showSlide(slideId);
        document.getElementById('admin-panel').classList.add('hidden');
      },
      testStage: function(stageNum) {
        startStage(stageNum);
        document.getElementById('admin-panel').classList.add('hidden');
      },
      clearAllComments: function() {
        if (confirm("Are you sure you want to purge all player comments?")) {
          localStorage.removeItem(STORAGE_KEY);
          renderComments();
        }
      }
    };

    document.getElementById('btn-save-media-cfg').addEventListener('click', () => {
      const introUrl = document.getElementById('cfg-intro-vid').value;
      introVideo.querySelector('source').src = introUrl;
      introVideo.load();
      alert("Media URLs successfully updated!");
    });

    /* Init app on page load */
    window.onload = function() {
      showSlide('slide-intro');
    };
  </script>
</body>
</html>
