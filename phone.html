<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IS SEONGHYEON A CAT?</title>
    <!-- Google Fonts: Titan One, Black Han Sans & Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Black+Han+Sans&family=Titan+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* Nhúng trực tiếp font 야놀자 야체 (Yanolja Yache) chuẩn */
        @font-face {
            font-family: 'YanoljaYacheR';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/YanoljaYacheR.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-pink: #f8d7da;
            --main-pink: #d87a93;
            --dark-burgundy: #592233;
            --card-pink: #ffc0cb;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        body {
            background-color: var(--bg-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        /* Mobile Container Frame */
        #game-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--main-pink);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        @media (min-width: 423px) {
            #game-container {
                border-radius: 30px;
                border: 8px solid #c25e79;
            }
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-pink);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-y: auto;
            display: none;
            z-index: 1;
        }
        .screen.active {
            display: flex;
            z-index: 10;
        }
        .title-exact-match {
            font-family: 'Titan One', cursive;
            color: #72334f;
            text-shadow: 
                0 0 6px #fce0e8,
                0 0 12px rgba(252, 224, 232, 0.7),
                2px 2px 4px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        /* INTRO SCREEN */
        #intro-screen {
            justify-content: center;
            gap: 20px;
        }
        #intro-screen h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .video-box-intro {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            border: 4px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-box-intro video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-box {
            width: 90%;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            border: 4px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-box video {
            width: 100%;
            height: auto;
            max-height: 45vh;
            object-fit: contain;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            width: 90%;
            justify-content: center;
        }
        .custom-btn, #bottom-action-btn {
            font-family: 'Titan One', 'YanoljaYacheR', 'Black Han Sans', cursive !important;
            background-color: #fff;
            color: var(--dark-burgundy);
            border: none;
            padding: 12px 18px;
            border-radius: 15px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        /* Yêu cầu: Tăng cỡ chữ lên 2 mức, thu hẹp khoảng cách chữ (0px) nhưng giữ nguyên chiều cao nút bấm */
        .korean-laugh-font {
            font-family: 'YanoljaYacheR', 'Black Han Sans', sans-serif !important;
            font-size: 1.45rem !important;
            letter-spacing: 0px !important;
            line-height: 1 !important;
            padding-top: 9px !important;
            padding-bottom: 9px !important;
            font-weight: 900;
        }
        .custom-btn:active {
            transform: scale(0.96);
        }
        .custom-btn.primary {
            background-color: var(--dark-burgundy);
            color: #fff;
        }
        /* SELECT STAGE SCREEN */
        #select-screen {
            padding: 20px 12px;
            overflow-y: auto;
            align-items: center;
        }
        .stages-scroll-area {
            width: 100%;
            max-width: 370px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding-bottom: 50px;
            align-items: center;
        }
        .stage-card-item {
            width: 100%;
            background: #fff;
            border-radius: 18px;
            padding: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            text-align: center;
        }
        .stage-media-wrapper {
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #000;
            cursor: pointer;
        }
        .stage-media-wrapper img, .stage-media-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
        .stage-card-item h3 {
            font-family: 'Titan One', cursive;
            color: var(--dark-burgundy);
            margin-top: 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }
        /* GAMEPLAY SCREEN */
        #gameplay-screen {
            padding: 12px;
        }
        .game-top-bar {
            width: 100%;
            background: #fff;
            border-radius: 14px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
        .top-btn {
            background: var(--dark-burgundy);
            color: #fff;
            border: none;
            padding: 6px 8px;
            border-radius: 8px;
            font-family: 'Titan One', cursive;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .stage-info-title {
            font-family: 'Titan One', cursive;
            font-size: 0.75rem;
            color: var(--dark-burgundy);
        }
        .game-stats {
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--dark-burgundy);
        }
        .preview-banner, .preview-banner span {
            background: #fff;
            padding: 6px 16px;
            border-radius: 15px;
            font-family: 'Titan One', cursive !important;
            color: var(--dark-burgundy);
            margin-bottom: 10px;
            font-size: 0.85rem;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        .preview-banner span {
            padding: 0;
            background: transparent;
            box-shadow: none;
            border-radius: 0;
            margin: 0;
        }
        /* GRID CARDS LAYOUT */
        .cards-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 360px;
            justify-content: center;
            align-content: center;
            flex-grow: 1;
            padding-bottom: 15px;
        }
        .grid-stage-1 { grid-template-columns: repeat(2, 1fr); }
        .grid-stage-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-stage-3 { grid-template-columns: repeat(3, 1fr); }
        .grid-stage-bonus { grid-template-columns: repeat(4, 1fr); }
        .card {
            aspect-ratio: 1/1;
            perspective: 1000px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s;
            transform-style: preserve-3d;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
        }
        .card-front {
            background-color: #ffc0cb;
            transform: rotateY(180deg);
        }
        .card-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-back {
            background-color: var(--card-pink);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        /* VICTORY SCREEN */
        #victory-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 15px;
            padding: 30px;
        }
        #victory-screen h2 {
            font-family: 'Titan One', cursive;
            font-size: 1.4rem;
            color: var(--dark-burgundy);
        }
        .victory-img-box {
            width: 170px;
            height: 170px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .victory-img-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .victory-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
            justify-content: center;
        }
        .btn-yes {
            background-color: #2ecc71 !important;
            color: white !important;
            flex: 1;
            padding: 12px;
            border-radius: 16px;
            font-family: 'Titan One', cursive;
            border: none;
            cursor: pointer;
        }
        .btn-no {
            background-color: #e74c3c !important;
            color: white !important;
            flex: 1;
            padding: 12px;
            border-radius: 16px;
            font-family: 'Titan One', cursive;
            border: none;
            cursor: pointer;
        }
        /* RESULT MEDIA & COMMENTS */
        #result-media-screen {
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
        }
        .comment-section-box {
            width: 100%;
            background: #fff;
            border-radius: 18px;
            padding: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .comment-section-box h3 {
            font-family: 'Titan One', cursive;
            color: var(--dark-burgundy);
            font-size: 0.95rem;
            text-align: center;
        }
        .comment-input, .name-input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid #f0d0d5;
            outline: none;
            font-size: 0.85rem;
            color: #333;
        }
        .comment-row-action {
            display: flex;
            gap: 8px;
        }
        .send-btn {
            background-color: var(--dark-burgundy);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-family: 'Titan One', cursive;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }
        .comment-item {
            background: #fff9fa;
            border: 1px solid #f5e1e5;
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }
        .comment-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--dark-burgundy);
        }
        .voted-badge {
            background-color: #2ecc71;
            color: white;
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 5px;
            font-family: 'Titan One', cursive;
        }
        .voted-badge.no {
            background-color: #e74c3c;
        }
        .comment-body {
            font-size: 0.85rem;
            color: #444;
        }
        .comment-footer-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.78rem;
            color: #555e68;
            margin-top: 2px;
        }
        .action-like, .action-reply {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            transition: color 0.15s ease, transform 0.1s ease;
        }
        .action-like:active {
            transform: scale(1.15);
        }
        .action-like.liked {
            color: #e74c3c;
        }
        .comment-menu-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            background: none;
            border: none;
            font-weight: bold;
            cursor: pointer;
            color: #666;
            font-size: 0.9rem;
        }
        .comment-dropdown {
            position: absolute;
            right: 8px;
            top: 26px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none;
            flex-direction: column;
            z-index: 5;
        }
        .comment-dropdown button {
            background: none;
            border: none;
            padding: 5px 12px;
            text-align: left;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .comment-dropdown button:hover {
            background: #f0f0f0;
        }
        .reply-container {
            margin-top: 4px;
            padding-left: 8px;
            border-left: 2px solid #e2a2b3;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .reply-item {
            font-size: 0.75rem;
            color: #555;
            background: #fce8ec;
            padding: 6px 8px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        /* ADMIN MODAL */
        #admin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .admin-content {
            background: #2b131c;
            width: 100%;
            max-width: 550px;
            border-radius: 18px;
            padding: 15px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 85vh;
            overflow-y: auto;
            border: 3px solid var(--main-pink);
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .admin-tab-btn {
            background: #4a2533;
            color: #fff;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.7rem;
            white-space: nowrap;
        }
        .admin-tab-btn.active {
            background: var(--main-pink);
            font-weight: bold;
        }
        .admin-section {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .admin-section.active {
            display: flex;
        }
    </style>
</head>
<body>
<div id="game-container">
    <!-- 1. INTRO SCREEN -->
    <div id="intro-screen" class="screen active">
        <h1 class="title-exact-match">IS SEONGHYEON A CAT?</h1>
        <div class="video-box-intro">
            <!-- Đã bổ sung đầy đủ controls, autoplay, loop chuẩn Safari mobile -->
            <video id="intro-video" src="intro-video-phone.mp4" controls autoplay loop playsinline preload="auto"></video>
        </div>
        <div class="btn-group">
            <button class="custom-btn" onclick="replayIntro()">REPLAY INTRO</button>
            <button class="custom-btn primary" onclick="goToSelectStage()">Start Game ➔</button>
        </div>
    </div>
    <!-- 2. SELECT STAGE SCREEN -->
    <div id="select-screen" class="screen" onclick="handleScreenClick(event)">
        <div class="stages-scroll-area" id="stages-scroll-container">
            <!-- EASY -->
            <div class="stage-card-item">
                <div class="stage-media-wrapper" onclick="toggleStageVideo(1, event)">
                    <img id="stage-img-1" src="stage1-easy-img-phone.jpg" alt="EASY">
                    <video id="stage-vid-1" src="stage1-easy-video-phone.mp4" loop playsinline style="display:none;"></video>
                </div>
                <h3 onclick="startStage(1)">EASY</h3>
            </div>
            <!-- MEDIUM -->
            <div class="stage-card-item">
                <div class="stage-media-wrapper" onclick="toggleStageVideo(2, event)">
                    <img id="stage-img-2" src="stage2-medium-img-phone.jpg" alt="MEDIUM">
                    <video id="stage-vid-2" src="stage2-medium-video-phone.mp4" loop playsinline style="display:none;"></video>
                </div>
                <h3 onclick="startStage(2)">MEDIUM</h3>
            </div>
            <!-- HARD -->
            <div class="stage-card-item">
                <div class="stage-media-wrapper" onclick="toggleStageVideo(3, event)">
                    <img id="stage-img-3" src="stage3-hard-img-phone.jpg" alt="HARD">
                    <video id="stage-vid-3" src="stage3-hard-video-phone.mp4" loop playsinline style="display:none;"></video>
                </div>
                <h3 onclick="startStage(3)">HARD</h3>
            </div>
        </div>
    </div>
    <!-- 3. GAMEPLAY SCREEN -->
    <div id="gameplay-screen" class="screen">
        <div class="game-top-bar">
            <button class="top-btn" onclick="goToSelectStage()">🏠 SELECT</button>
            <div class="stage-info-title" id="game-stage-title">STAGE 1: SKEPTICAL</div>
            <div class="game-stats">
                <span id="timer-display">⏱️ 00:00</span>
                <span id="matches-display">🐾 0</span>
            </div>
            <button class="top-btn" id="audio-toggle-btn" onclick="toggleStageAudio()">🔊</button>
        </div>
        <div class="preview-banner" id="preview-banner-box">Preview Time: <span id="preview-sec">3</span>s</div>
        <div class="cards-grid" id="cards-grid-container"></div>
    </div>
    <!-- 4. VICTORY SCREEN -->
    <div id="victory-screen" class="screen">
        <h2 class="title-exact-match" id="victory-title-text" style="font-size: 1.4rem;">STAGE 1 CLEARED!</h2>
        <div class="victory-img-box">
            <img id="victory-img-elem" src="victory1-img-phone.png" alt="Victory">
        </div>
        <h2 id="victory-question-text" style="font-size: 1rem; color: var(--dark-burgundy);">ARE YOU STILL SKEPTICAL?</h2>
        <div class="victory-buttons" id="victory-buttons-container"></div>
    </div>
    <!-- 5. RESULT MEDIA & COMMENT SCREEN (YES/NO) -->
    <div id="result-media-screen" class="screen" style="justify-content: center; gap: 15px;">
        <div class="video-box" id="result-video-box" style="width: 100%;">
            <video id="result-video-player" autoplay loop playsinline></video>
        </div>
        <!-- Khung bình luận ban đầu ẩn -->
        <div class="comment-section-box" id="comment-box-elem" style="display: none; width: 100%;">
            <h3 class="title-exact-match" style="font-size: 0.95rem;">LEAVE YOUR COMMENTS</h3>
            <input type="text" id="user-name-input" class="name-input font-vietnamese" placeholder="Your name..." autocomplete="off">
            <div class="comment-row-action">
                <input type="text" id="user-comment-input" class="comment-input font-vietnamese" placeholder="Write a comment..." autocomplete="off">
                <button class="send-btn" onclick="postComment()">Send</button>
            </div>
            <div class="comments-list font-vietnamese" id="comments-list-container"></div>
        </div>
        <button class="custom-btn primary" id="bottom-action-btn" onclick="handleBottomAction()" style="width: 100%; flex-shrink: 0;">ㅋㅋㅋㅋㅋㅋ</button>
    </div>
</div>
<!-- ADMIN CONFIGURATION MODAL -->
<div id="admin-modal">
    <div class="admin-content">
        <div class="admin-header">
            <h3 class="title-exact-match" style="color:#fff; font-size:1rem;">GAME CONFIGURATION & MEDIA UPLOAD</h3>
            <button onclick="closeAdmin()" style="background:none; border:none; color:#fff; font-size:1.1rem; cursor:pointer;">✕</button>
        </div>
        <div class="admin-tabs">
            <button class="admin-tab-btn active" onclick="switchAdminTab(0)">Intro & Hover</button>
            <button class="admin-tab-btn" onclick="switchAdminTab(1)">Stage 1</button>
            <button class="admin-tab-btn" onclick="switchAdminTab(2)">Stage 2</button>
            <button class="admin-tab-btn" onclick="switchAdminTab(3)">Stage 3</button>
            <button class="admin-tab-btn" onclick="switchAdminTab(4)">Stage Bonus</button>
            <button class="admin-tab-btn" onclick="switchAdminTab(5)">Test YES/NO</button>
            <button class="admin-tab-btn" onclick="switchAdminTab(6)">Comments</button>
        </div>
        <div class="admin-section active">
            <button class="custom-btn primary" onclick="goToScreen('intro-screen')">Test Run Intro</button>
            <button class="custom-btn primary" onclick="goToScreen('select-screen')">Test Run Stage Select</button>
        </div>
        <div class="admin-section">
            <button class="custom-btn primary" onclick="startStage(1)">Test Run Stage 1</button>
        </div>
        <div class="admin-section">
            <button class="custom-btn primary" onclick="startStage(2)">Test Run Stage 2</button>
        </div>
        <div class="admin-section">
            <button class="custom-btn primary" onclick="startStage(3)">Test Run Stage 3</button>
        </div>
        <div class="admin-section">
            <button class="custom-btn primary" onclick="startStage(4)">Test Run Stage Bonus</button>
        </div>
        <div class="admin-section">
            <div style="display:flex; gap:10px;">
                <button class="custom-btn primary" onclick="showResultScreen('yes')">Test YES Slide</button>

    function playSoundEffect(type) {
        if (isAudioMuted) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (type === 'preview_tick') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'match') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.setValueAtTime(140, now + 0.15);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'victory') {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.frequency.setValueAtTime(freq, now + idx * 0.12);
                g.gain.setValueAtTime(0.2, now + idx * 0.12);
                g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
                o.start(now + idx * 0.12);
                o.stop(now + idx * 0.12 + 0.3);
            });
        }
    }

            stopAllStageVideos();

        if (video.paused && video.style.display !== 'block') {
            img.style.display = 'none';
            video.style.display = 'block';
            video.muted = false;
            video.play().catch(e => {});

    function stopAllStageVideos() {
        [1, 2, 3].forEach(id => {

    function handleScreenClick(event) {

    function toggleStageAudio() {
        isAudioMuted = !isAudioMuted;
        const btn = document.getElementById('audio-toggle-btn');
        if (currentBgmAudio) currentBgmAudio.muted = isAudioMuted;
        btn.innerText = isAudioMuted ? "🔇" : "🔊";
    }

    function startStage(stageId) {
        currentStageId = stageId;
        const stage = stagesData[stageId];
        goToScreen('gameplay-screen');
        document.getElementById('game-stage-title').innerText = stage.name;
        document.getElementById('matches-display').innerText = `🐾 0`;
        matchesCount = 0;
        secondsElapsed = 0;
        canInteract = false;
        
        currentBgmAudio = new Audio(stage.audio);
        currentBgmAudio.volume = 0.8;
        currentBgmAudio.loop = true;
        currentBgmAudio.muted = isAudioMuted;
        currentBgmAudio.play().catch(e => {});
        
        if(gameTimer) clearInterval(gameTimer);
        gameTimer = setInterval(() => {
            secondsElapsed++;
            let mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            let secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timer-display').innerText = `⏱️ ${mins}:${secs}`;
        }, 1000);
        const gridContainer = document.getElementById('cards-grid-container');
        gridContainer.className = `cards-grid grid-stage-${stageId === 4 ? 'bonus' : stageId}`;
        gridContainer.innerHTML = '';
        stage.cards.forEach((card) => {
            const cardElem = document.createElement('div');
            cardElem.className = 'card flipped'; 
            cardElem.dataset.id = card.id;
            cardElem.innerHTML = `
                <div class="card-inner">
                    <div class="card-front"><img src="${card.img}" alt="card"></div>
                    <div class="card-back"><img src="card-back-1-2-3-bonus-phone.jpg" alt="back"></div>
                </div>
            `;
            cardElem.addEventListener('click', () => onCardClick(cardElem));
            gridContainer.appendChild(cardElem);
        });
        let previewSec = stage.previewTime;
        document.getElementById('preview-banner-box').style.display = 'block';
        document.getElementById('preview-sec').innerText = previewSec;
        let previewInterval = setInterval(() => {
            previewSec--;
            playSoundEffect('preview_tick');
            document.getElementById('preview-sec').innerText = previewSec;
            if(previewSec <= 0) {
                clearInterval(previewInterval);
                document.getElementById('preview-banner-box').style.display = 'none';
                document.querySelectorAll('.card').forEach(c => c.classList.remove('flipped'));
                canInteract = true;
            }
        }, 1000);
    }

    function onCardClick(cardElem) {
        if(!canInteract || cardElem.classList.contains('flipped') || cardElem.classList.contains('matched')) return;
        playSoundEffect('click');
        cardElem.classList.add('flipped');
        if(!firstSelectedCard) {
            firstSelectedCard = cardElem;
        } else {
            canInteract = false;
            let id1 = parseInt(firstSelectedCard.dataset.id);
            let id2 = parseInt(cardElem.dataset.id);
            let stage = stagesData[currentStageId];
            let isMatch = stage.pairs.some(pair => (pair[0] === id1 && pair[1] === id2) || (pair[0] === id2 && pair[1] === id1));
            if(isMatch) {
                playSoundEffect('match');
                setTimeout(() => {
                    firstSelectedCard.classList.add('matched');
                    cardElem.classList.add('matched');
                    firstSelectedCard = null;
                    matchesCount++;
                    document.getElementById('matches-display').innerText = `🐾 ${matchesCount}`;
                    canInteract = true;
                    if(matchesCount === stage.pairs.length) {
                        clearInterval(gameTimer);
                        if(currentBgmAudio) currentBgmAudio.pause();
                        playSoundEffect('victory');
                        setTimeout(showVictoryScreen, 500);
                    }
                }, 300);
            } else {
                playSoundEffect('wrong');
                setTimeout(() => {
                    firstSelectedCard.classList.remove('flipped');
                    cardElem.classList.remove('flipped');
                    firstSelectedCard = null;
                    canInteract = true;
                }, 700);
            }
        }
    }

    function postComment() {
        const nameInput = document.getElementById('user-name-input');
        const commentInput = document.getElementById('user-comment-input');
        if(!nameInput.value.trim() || !commentInput.value.trim()) return;
        const newComment = {
            id: Date.now(),
            name: nameInput.value.trim(),
            text: commentInput.value.trim(),
            vote: currentVoteChoice,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            likes: 0,
            likedUsers: {},
            replies: []

        commentsRef.push(newComment);
        commentInput.value = '';
    }

    function renderComments() {
        const listContainer = document.getElementById('comments-list-container');
        if (!listContainer) return;
        listContainer.innerHTML = '';
        commentsData.forEach(c => {
            const item = document.createElement('div');
            item.className = 'comment-item';
            
            const likedUsers = c.likedUsers || {};
            const isLiked = likedUsers[mySessionId] === true;
            const heartIconHtml = isLiked ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';

            let repliesHtml = '';
            if (c.replies && c.replies.length > 0) {
                repliesHtml = '<div class="reply-container">';
                c.replies.forEach((rep, rIndex) => {
                    const repLikedUsers = rep.likedUsers || {};
                    const isRepLiked = repLikedUsers[mySessionId] === true;
                    const repHeartIconHtml = isRepLiked ? '<i class="fa-solid fa-heart"></i>' : '<i class="fa-regular fa-heart"></i>';

                    repliesHtml += `
                        <div class="reply-item">
                            <div><b>${rep.name}:</b> <span style="color:#d87a93; font-weight:600;">@${rep.replyTo || c.name}</span> ${rep.text}</div>
                            <div style="display:flex; gap:12px; font-size:0.74rem; color:#555e68; margin-top:2px;">
                                <span class="action-like ${isRepLiked ? 'liked' : ''}" onclick="likeReply('${c.firebaseId}', ${rIndex})">${repHeartIconHtml} ${rep.likes || 0}</span>
                                <span class="action-reply" onclick="toggleReplyBox('${c.firebaseId}', ${rIndex})">Reply</span>
                            </div>
                            <div class="reply-input-inline" id="reply-inline-${c.firebaseId}-${rIndex}" style="display:none; flex-direction:column; gap:4px; margin-top:4px;">
                                <input type="text" id="inline-name-${c.firebaseId}-${rIndex}" class="name-input" placeholder="Your name..." autocomplete="off" style="font-size:0.75rem; padding:4px 8px;">
                                <div style="display:flex; gap:6px;">
                                    <input type="text" id="inline-text-${c.firebaseId}-${rIndex}" class="comment-input" placeholder="Reply to @${rep.name}..." autocomplete="off" style="font-size:0.75rem; padding:4px 8px;">
                                    <button class="send-btn" onclick="postInlineReply('${c.firebaseId}', ${rIndex}, '${rep.name}')" style="padding:4px 8px; font-size:0.7rem;">Send</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                repliesHtml += '</div>';
            }
            item.innerHTML = `
                <div class="comment-header">
                    <span>${c.name}</span>
                    <span class="voted-badge ${c.vote === 'no' ? 'no' : ''}">voted ${c.vote.toUpperCase()}</span>
                    <span class="comment-time" style="font-weight:normal; color:#777; font-size:0.7rem;">${c.time || ''}</span>
                    <button class="comment-menu-btn" onclick="toggleCommentMenu('${c.firebaseId}')">⋮</button>
                    <div class="comment-dropdown" id="dropdown-${c.firebaseId}">
                        <button onclick="editComment('${c.firebaseId}')">Edit</button>
                    </div>
                </div>
                <div class="comment-body">${c.text}</div>
                <div class="comment-footer-actions">
                    <span class="action-like ${isLiked ? 'liked' : ''}" onclick="likeComment('${c.firebaseId}')">${heartIconHtml} ${c.likes || 0}</span>
                    <span class="action-reply" onclick="toggleRootReplyBox('${c.firebaseId}')">Reply</span>
                </div>
                <div class="reply-input-inline" id="reply-root-${c.firebaseId}" style="display:none; flex-direction:column; gap:4px; margin-top:6px;">
                    <input type="text" id="root-name-${c.firebaseId}" class="name-input" placeholder="Your name..." autocomplete="off" style="font-size:0.75rem; padding:5px 8px;">
                    <div style="display:flex; gap:6px;">
                        <input type="text" id="root-text-${c.firebaseId}" class="comment-input" placeholder="Reply to @${c.name}..." autocomplete="off" style="font-size:0.75rem; padding:5px 8px;">
                        <button class="send-btn" onclick="postRootReply('${c.firebaseId}', '${c.name}')" style="padding:5px 10px; font-size:0.7rem;">Send</button>
                    </div>
                </div>
                ${repliesHtml}
            `;
            listContainer.appendChild(item);
        });
    }

    function toggleCommentMenu(firebaseId) {
        const dropdown = document.getElementById(`dropdown-${firebaseId}`);
        document.querySelectorAll('.comment-dropdown').forEach(d => { if(d !== dropdown) d.style.display = 'none'; });
        dropdown.style.display = dropdown.style.display === 'flex' ? 'none' : 'flex';
    }

    function editComment(firebaseId) {
        const comment = commentsData.find(c => c.firebaseId === firebaseId);
        const newText = prompt("Edit your comment:", comment.text);
        if(newText !== null && newText.trim() !== '') {
            commentsRef.child(firebaseId).update({ text: newText.trim() });
        }
    }

    function likeComment(firebaseId) {
        playSoundEffect('click');
        const commentRef = commentsRef.child(firebaseId);
        commentRef.once('value', snapshot => {
            const val = snapshot.val();
            if(!val) return;
            let likedUsers = val.likedUsers || {};
            let likes = val.likes || 0;
            if (likedUsers[mySessionId]) {
                delete likedUsers[mySessionId];
                likes = Math.max(0, likes - 1);
            } else {
                likedUsers[mySessionId] = true;
                likes += 1;
            }
            commentRef.update({ likes, likedUsers });
        });
    }

    function toggleRootReplyBox(firebaseId) {
        playSoundEffect('click');
        const box = document.getElementById(`reply-root-${firebaseId}`);
        if(box) box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function postRootReply(firebaseId, targetName) {
        const nameInput = document.getElementById(`root-name-${firebaseId}`);
        const textInput = document.getElementById(`root-text-${firebaseId}`);
        if(!nameInput.value.trim() || !textInput.value.trim()) return;
        const comment = commentsData.find(c => c.firebaseId === firebaseId);
        let replies = comment.replies ? [...comment.replies] : [];
        replies.push({
            name: nameInput.value.trim(),
            replyTo: targetName,
            text: textInput.value.trim(),
            likes: 0,
            likedUsers: {}
        });
        commentsRef.child(firebaseId).update({ replies: replies });
        playSoundEffect('click');
    }

    function toggleReplyBox(firebaseId, rIndex) {
        playSoundEffect('click');
        const box = document.getElementById(`reply-inline-${firebaseId}-${rIndex}`);
        if(box) box.style.display = box.style.display === 'flex' ? 'none' : 'flex';
    }

    function postInlineReply(firebaseId, rIndex, targetName) {
        const nameInput = document.getElementById(`inline-name-${firebaseId}-${rIndex}`);
        const textInput = document.getElementById(`inline-text-${firebaseId}-${rIndex}`);
        if(!nameInput.value.trim() || !textInput.value.trim()) return;
        const comment = commentsData.find(c => c.firebaseId === firebaseId);
        let replies = comment.replies ? [...comment.replies] : [];
        replies.push({
            name: nameInput.value.trim(),
            replyTo: targetName,
            text: textInput.value.trim(),
            likes: 0,
            likedUsers: {}
        });
        commentsRef.child(firebaseId).update({ replies: replies });
        playSoundEffect('click');
    }

    function likeReply(firebaseId, replyIndex) {
        playSoundEffect('click');
        const commentRef = commentsRef.child(firebaseId);
        commentRef.once('value', snapshot => {
            const val = snapshot.val();
            if(!val || !val.replies || !val.replies[replyIndex]) return;
            let replies = [...val.replies];
            let rep = replies[replyIndex];
            let likedUsers = rep.likedUsers || {};
            let likes = rep.likes || 0;
            if (likedUsers[mySessionId]) {
                delete likedUsers[mySessionId];
                likes = Math.max(0, likes - 1);
            } else {
                likedUsers[mySessionId] = true;
                likes += 1;
            }
            rep.likes = likes;
            rep.likedUsers = likedUsers;
            commentRef.update({ replies: replies });
        });
    }

    function renderAdminCommentsList() {
        const adminList = document.getElementById('admin-comments-manage-list');
        if (!adminList) return;
        adminList.innerHTML = '';
        commentsData.forEach(c => {
            const row = document.createElement('div');
            row.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:#3b1a26; padding:6px 10px; border-radius:6px; font-size:0.75rem;";
            row.innerHTML = `
                <span><b>${c.name}:</b> ${c.text}</span>
                <button onclick="adminDeleteComment('${c.firebaseId}')" style="background:#e74c3c; color:#fff; border:none; padding:3px 8px; border-radius:4px; cursor:pointer;">Xóa</button>
            `;
            adminList.appendChild(row);
        });
    }

    function adminDeleteComment(firebaseId) {
        if(confirm("Admin: Bạn có chắc chắn muốn xóa bình luận này không?")) {
            commentsRef.child(firebaseId).remove();
        }
    }

    window.addEventListener('keydown', (e) => {
        if(e.shiftKey && e.key.toLowerCase() === 'u') {
            document.getElementById('admin-modal').style.display = 'flex';
        }
    });

    function closeAdmin() {
        document.getElementById('admin-modal').style.display = 'none';
    }

    function switchAdminTab(index) {
        const tabs = document.querySelectorAll('.admin-tab-btn');
        const sections = document.querySelectorAll('.admin-section');
        tabs.forEach((t, i) => {
            t.classList.toggle('active', i === index);
            sections[i].classList.toggle('active', i === index);
        });
    }

    window.onload = function() {
        goToScreen('intro-screen');
    };
</script>
</body>
</html>
